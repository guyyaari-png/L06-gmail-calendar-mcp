[project]
name = "gmail-calendar"
version = "0.1.0"
description = "MCP server exposing Gmail (search/read/draft) and Google Calendar tools over stdio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
]

[tool.uv]
package = false
